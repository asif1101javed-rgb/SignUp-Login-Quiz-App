<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SMIT Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #eef2f7;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* LOGIN CARD */

        .login-card {
            width: 400px;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
        }

        /* HEADER */

        .login-header {
            padding: 30px;
            background: linear-gradient(135deg, #111827, #2563eb);
            color: white;
            text-align: center;
        }

        .logo {
            width: 65px;
            height: 65px;
            background: white;
            color: #2563eb;
            border-radius: 14px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin: 0 auto 15px;

            font-size: 19px;
            font-weight: bold;
        }

        .login-header h1 {
            font-size: 24px;
            margin-bottom: 6px;
        }

        .login-header p {
            font-size: 12px;
            opacity: 0.8;
            letter-spacing: 1px;
        }

        /* FORM */

        .login-content {
            padding: 30px;
        }

        .login-content h2 {
            color: #111827;
            font-size: 21px;
            margin-bottom: 6px;
        }

        .login-content .subtitle {
            color: #64748b;
            font-size: 13px;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            color: #172033;
            font-weight: bold;
            margin-bottom: 7px;
        }

        .input-group input {
            width: 100%;
            height: 45px;
            border: 1px solid #dbe2ea;
            border-radius: 10px;
            padding: 0 14px;
            font-size: 13px;
            outline: none;
            color: #172033;
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .input-group input::placeholder {
            color: #94a3b8;
        }

        /* LOGIN BUTTON */

        #login {
            width: 100%;
            height: 45px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #111827, #2563eb);
            color: white;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        #login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.3);
        }

        /* SIGNUP */

        .signup {
            text-align: center;
            margin-top: 22px;
            font-size: 12px;
            color: #64748b;
        }

        .signup a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        .signup a:hover {
            text-decoration: underline;
        }

        /* FOOTER */

        .login-footer {
            background: #111827;
            color: white;
            padding: 12px;
            text-align: center;
            font-size: 10px;
        }

        .login-footer span {
            color: #60a5fa;
        }

        /* MOBILE */

        @media(max-width: 450px) {

            body {
                padding: 20px;
            }

            .login-card {
                width: 100%;
            }

            .login-content {
                padding: 25px;
            }
        }
    </style>

</head>

<body>

    <div class="login-card">

        <!-- HEADER -->

        <div class="login-header">

            <div class="logo">
                SMIT
            </div>

            <h1>SMIT Hyderabad</h1>

            <p>STUDENT PORTAL</p>

        </div>


        <!-- LOGIN FORM -->

        <div class="login-content">

            <h2>Welcome Back</h2>

            <p class="subtitle">
                Login to access your student account
            </p>


            <div class="input-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter Email Address"
                >

            </div>


            <div class="input-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter Password"
                >

            </div>


            <button id="login">
                Login
            </button>


            <div class="signup">

                Don't have an account?

                <a href="./signup.html">
                    Create Account
                </a>

            </div>

        </div>


        <!-- FOOTER -->

        <div class="login-footer">

            Property of <span>SMIT Hyderabad</span>

        </div>

    </div>
